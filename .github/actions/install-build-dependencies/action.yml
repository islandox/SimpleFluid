name: Install build dependencies
description: Install the MPI, HDF5, NetCDF, Boost, GoogleTest and ccache packages used to build Trilinos and SimpleFluid.

runs:
  using: composite
  steps:
    - name: Install build dependencies on Ubuntu
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ccache \
          git \
          cmake \
          ninja-build \
          pkg-config \
          openmpi-bin \
          libopenmpi-dev \
          libblas-dev \
          liblapack-dev \
          libboost-dev \
          libhdf5-openmpi-dev \
          libnetcdf-mpi-dev \
          libpnetcdf-dev \
          netcdf-bin \
          libgtest-dev \
          libgmock-dev \
          zlib1g-dev

        ccache --version

    - name: Install build dependencies on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install \
          boost \
          ccache \
          googletest \
          hdf5-mpi \
          open-mpi

        brew list --versions boost ccache googletest hdf5-mpi open-mpi
        clang --version
        clang++ --version
        mpicc --showme:command
        mpicxx --showme:command
        mpifort --showme:command
