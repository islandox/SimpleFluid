name: Setup Trilinos from source
description: Build and cache Trilinos from source

inputs:
  trilinos-version:
    description: Trilinos git tag
    required: false
    default: trilinos-release-17-1-1
  c-compiler:
    required: false
    default: mpicc
  cxx-compiler:
    required: false
    default: mpicxx
  fortran-compiler:
    required: false
    default: mpifort
  cache-suffix:
    required: false
    default: v1

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          gfortran \
          git \
          cmake \
          ninja-build \
          pkg-config \
          openmpi-bin \
          libopenmpi-dev \
          libblas-dev \
          liblapack-dev \
          libboost-dev \
          libhdf5-openmpi-dev \
          libnetcdf-mpi-dev \
          zlib1g-dev

    - name: Inspect HDF5 and NetCDF
      shell: bash
      run: |
        which h5pcc || true
        h5pcc -show || true

        which nc-config || true
        nc-config --version || true
        nc-config --libs || true
        nc-config --cflags || true

        dpkg -l | grep -Ei 'hdf5|netcdf|pnetcdf' || true

    - name: Restore Trilinos build cache
      id: trilinos-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ github.workspace }}/_deps/trilinos-build
          ${{ github.workspace }}/_deps/trilinos-install
        key: trilinos-${{ inputs.trilinos-version }}-${{ runner.os }}-${{ inputs.compiler-id }}-mpi-all-${{ inputs.cache-suffix }}
        restore-keys: |
          trilinos-${{ inputs.trilinos-version }}-${{ runner.os }}-${{ inputs.compiler-id }}-mpi-all-
          trilinos-${{ inputs.trilinos-version }}-${{ runner.os }}-${{ inputs.compiler-id }}-mpi-core-

    - name: Cache Trilinos install
      id: cache-trilinos
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/_deps/trilinos-install
        key: trilinos-${{ inputs.trilinos-version }}-${{ runner.os }}-${{ inputs.cxx-compiler }}-mpi-core-v1

    - name: Build Trilinos from source
      if: steps.cache-trilinos.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 --branch ${{ inputs.trilinos-version }} \
          https://github.com/trilinos/Trilinos.git \
          ${{ github.workspace }}/_deps/Trilinos

        cmake -S ${{ github.workspace }}/_deps/Trilinos \
          -B ${{ github.workspace }}/_deps/trilinos-build \
          -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/_deps/trilinos-install \
          -D CMAKE_C_COMPILER=${{ inputs.c-compiler }} \
          -D CMAKE_CXX_COMPILER=${{ inputs.cxx-compiler }} \
          -D CMAKE_Fortran_COMPILER=${{ inputs.fortran-compiler }} \
          -D CMAKE_CXX_STANDARD=20 \
          -D CMAKE_CXX_EXTENSIONS=OFF \
          -D TPL_ENABLE_MPI=ON \
          -D TPL_ENABLE_BLAS=ON \
          -D TPL_ENABLE_LAPACK=ON \
          -D TPL_ENABLE_BOOST=ON \
          -D TPL_ENABLE_HDF5=ON \
          -D TPL_ENABLE_Netcdf=ON \
          -D Trilinos_ENABLE_TESTS=OFF \
          -D Trilinos_ENABLE_EXAMPLES=OFF \
          -D Trilinos_ENABLE_Teuchos=ON \
          -D Trilinos_ENABLE_Kokkos=ON \
          -D Trilinos_ENABLE_KokkosKernels=ON \
          -D Trilinos_ENABLE_Tpetra=ON \
          -D Trilinos_ENABLE_Belos=ON \
          -D Trilinos_ENABLE_Ifpack2=ON \
          -D Trilinos_ENABLE_MueLu=ON \
          -D Trilinos_ENABLE_STK=ON \
          -D Trilinos_ENABLE_SEACAS=ON \
          -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF

        cmake --build ${{ github.workspace }}/_deps/trilinos-build --parallel 1
        cmake --install ${{ github.workspace }}/_deps/trilinos-build

    - name: Export Trilinos prefix
      shell: bash
      run: |
        echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/_deps/trilinos-install:$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
        echo "Trilinos_DIR=${{ github.workspace }}/_deps/trilinos-install/lib/cmake/Trilinos" >> "$GITHUB_ENV"