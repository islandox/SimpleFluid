name: Setup Trilinos from source
description: Build and cache Trilinos from source

inputs:
  trilinos-version:
    description: Trilinos git tag
    required: false
    default: trilinos-release-17-1-1
  compiler-id:
    required: true
  c-compiler:
    required: false
    default: mpicc
  cxx-compiler:
    required: false
    default: mpicxx
  fortran-compiler:
    required: false
    default: mpifort
  cache-suffix:
    required: false
    default: v1

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          cmake \
          ninja-build \
          pkg-config \
          openmpi-bin \
          libopenmpi-dev \
          libblas-dev \
          liblapack-dev \
          libboost-dev \
          libhdf5-openmpi-dev \
          libnetcdf-mpi-dev \
          libpnetcdf-dev \
          netcdf-bin \
          libgtest-dev \
          libgmock-dev \
          zlib1g-dev

    - name: Inspect HDF5 and NetCDF
      shell: bash
      run: |
        which h5pcc || true
        h5pcc -show || true

        which nc-config || true

        echo "=== libnetcdf-mpi-dev files ==="
        dpkg -L libnetcdf-mpi-dev | grep -E 'netcdf\.h$|libnetcdf\.so$|cmake|pkgconfig|nc-config' || true

        echo "=== possible NetCDF headers ==="
        find /usr/include /usr/lib/x86_64-linux-gnu -name netcdf.h -o -name libnetcdf.so 2>/dev/null || true

        nc-config --version || true
        nc-config --libs || true
        nc-config --cflags || true

        dpkg -l | grep -Ei 'hdf5|netcdf|pnetcdf' || true

    - name: Restore Trilinos install cache
      id: cache-trilinos
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/_deps/partitioners_install
          ${{ github.workspace }}/_deps/trilinos_install
        key: ${{ inputs.trilinos-version }}-install-${{ runner.os }}-${{ inputs.compiler-id }}-${{ inputs.cache-suffix }}

    - name: Restore Trilinos build cache
      id: cache-trilinos-build
      if: steps.cache-trilinos.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/_deps/trilinos_build
        key: ${{ inputs.trilinos-version }}-build-${{ runner.os }}-${{ inputs.compiler-id }}-${{ inputs.cache-suffix }}
        restore-keys: |
          ${{ inputs.trilinos-version }}-build-${{ runner.os }}-${{ inputs.compiler-id }}-
          trilinos-${{ inputs.trilinos-version }}-${{ runner.os }}-${{ inputs.compiler-id }}-mpi-all-

    - name: Build METIS and ParMETIS from source
      if: steps.cache-trilinos.outputs.cache-hit != 'true'
      shell: bash
      run: |
        PARTITIONER_PREFIX="${{ github.workspace }}/_deps/partitioners_install"
        mkdir -p "$PARTITIONER_PREFIX"

        clone_pinned() {
          local repository_url="$1"
          local checkout_dir="$2"
          local revision="$3"

          git init "$checkout_dir"
          git -C "$checkout_dir" remote add origin "$repository_url"
          git -C "$checkout_dir" fetch --depth 1 origin "$revision"
          git -C "$checkout_dir" checkout --detach FETCH_HEAD
        }

        clone_pinned \
          https://github.com/KarypisLab/GKlib.git \
          "${{ github.workspace }}/_deps/GKlib" \
          3b7d61b9f885063c89901f3901fb4426f9cfb58f
        clone_pinned \
          https://github.com/KarypisLab/METIS.git \
          "${{ github.workspace }}/_deps/METIS" \
          272d4a91c5f66c92327493339a476c553ebf1f5d
        clone_pinned \
          https://github.com/KarypisLab/ParMETIS.git \
          "${{ github.workspace }}/_deps/ParMETIS" \
          7436de671433c248e4203e1640a65b778845e6fc

        if [ "${{ inputs.compiler-id }}" = "LLVM" ]; then
          export OMPI_CC="$(command -v clang)"
          export OMPI_CXX="$(command -v clang++)"
        elif [ "${{ inputs.compiler-id }}" = "GCC" ]; then
          export OMPI_CC="$(command -v gcc)"
          export OMPI_CXX="$(command -v g++)"
        fi

        make -C "${{ github.workspace }}/_deps/GKlib" config \
          shared=1 \
          cc="${{ inputs.c-compiler }}" \
          prefix="$PARTITIONER_PREFIX"
        make -C "${{ github.workspace }}/_deps/GKlib" --jobs 2
        make -C "${{ github.workspace }}/_deps/GKlib" install

        make -C "${{ github.workspace }}/_deps/METIS" config \
          shared=1 \
          cc="${{ inputs.c-compiler }}" \
          prefix="$PARTITIONER_PREFIX" \
          gklib_path="$PARTITIONER_PREFIX"
        make -C "${{ github.workspace }}/_deps/METIS" --jobs 2
        make -C "${{ github.workspace }}/_deps/METIS" install

        export LD_LIBRARY_PATH="$PARTITIONER_PREFIX/lib:${LD_LIBRARY_PATH:-}"

        make -C "${{ github.workspace }}/_deps/ParMETIS" config \
          shared=1 \
          cc=mpicc \
          prefix="$PARTITIONER_PREFIX" \
          gklib_path="$PARTITIONER_PREFIX" \
          metis_path="$PARTITIONER_PREFIX"
        make -C "${{ github.workspace }}/_deps/ParMETIS" --jobs 2
        make -C "${{ github.workspace }}/_deps/ParMETIS" install

        test -f "$PARTITIONER_PREFIX/include/parmetis.h"
        test -e "$PARTITIONER_PREFIX/lib/libGKlib.so"
        test -e "$PARTITIONER_PREFIX/lib/libmetis.so"
        test -e "$PARTITIONER_PREFIX/lib/libparmetis.so"

    - name: Build Trilinos from source
      if: steps.cache-trilinos.outputs.cache-hit != 'true'
      shell: bash
      run: |
        PARTITIONER_PREFIX="${{ github.workspace }}/_deps/partitioners_install"
        export LD_LIBRARY_PATH="$PARTITIONER_PREFIX/lib:${LD_LIBRARY_PATH:-}"

        git clone --depth 1 --branch ${{ inputs.trilinos-version }} \
          https://github.com/trilinos/Trilinos.git \
          ${{ github.workspace }}/_deps/Trilinos

        # Patch Teuchos for LLVM: C++23 requires `return {}` instead of `return 0`
        # in constexpr functions returning a magnitudeType (which may not be int).
        # See Teuchos_ScalarTraitsDecl.hpp line ~120.
        if [ "${{ inputs.compiler-id }}" = "LLVM" ]; then
          TEUCHOS_SCALAR_TRAITS="${{ github.workspace }}/_deps/Trilinos/packages/teuchos/core/src/Teuchos_ScalarTraitsDecl.hpp"
          if [ -f "$TEUCHOS_SCALAR_TRAITS" ]; then
            sed -i '120s/return 0/return {}/' "$TEUCHOS_SCALAR_TRAITS"
            echo "Patched Teuchos_ScalarTraitsDecl.hpp for LLVM"
          else
            echo "WARNING: Teuchos_ScalarTraitsDecl.hpp not found at expected path"
          fi
        fi

        NETCDF_INCLUDE_DIR="$(dpkg -L libnetcdf-mpi-dev | grep '/netcdf.h$' | head -n 1 | xargs dirname)"
        NETCDF_LIBRARY="$(dpkg -L libnetcdf-mpi-dev | grep '/libnetcdf.so$' | head -n 1)"

        if [ -z "$NETCDF_INCLUDE_DIR" ] || [ -z "$NETCDF_LIBRARY" ]; then
          echo "Could not locate NetCDF MPI headers/library"
          dpkg -L libnetcdf-mpi-dev
          exit 1
        fi

        if [ "${{ inputs.compiler-id }}" = "LLVM" ]; then
          if command -v flang-new >/dev/null 2>&1; then
            FC_PATH="$(command -v flang-new)"
          elif command -v flang >/dev/null 2>&1; then
            FC_PATH="$(command -v flang)"
          else
            echo "No LLVM flang found"
            find /usr/bin -maxdepth 1 -name '*flang*' -print
            exit 1
          fi

          export OMPI_CC="$(command -v clang)"
          export OMPI_CXX="$(command -v clang++)"
          export OMPI_FC="$FC_PATH"
        elif [ "${{ inputs.compiler-id }}" = "GCC" ]; then
          export OMPI_CC="$(command -v gcc)"
          export OMPI_CXX="$(command -v g++)"
          export OMPI_FC="$(command -v gfortran)"
        fi

        echo "NETCDF_INCLUDE_DIR=$NETCDF_INCLUDE_DIR"
        echo "NETCDF_LIBRARY=$NETCDF_LIBRARY"

        cmake -S ${{ github.workspace }}/_deps/Trilinos \
          -B ${{ github.workspace }}/_deps/trilinos_build \
          -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/_deps/trilinos_install \
          -D CMAKE_C_COMPILER=mpicc \
          -D CMAKE_CXX_COMPILER=mpicxx \
          -D CMAKE_Fortran_COMPILER=mpifort \
          -D CMAKE_CXX_STANDARD=20 \
          -D CMAKE_CXX_EXTENSIONS=OFF \
          -D TPL_ENABLE_MPI=ON \
          -D TPL_ENABLE_BLAS=ON \
          -D TPL_ENABLE_LAPACK=ON \
          -D TPL_ENABLE_METIS=ON \
          -D TPL_METIS_INCLUDE_DIRS="$PARTITIONER_PREFIX/include" \
          -D TPL_METIS_LIBRARIES="$PARTITIONER_PREFIX/lib/libmetis.so;$PARTITIONER_PREFIX/lib/libGKlib.so" \
          -D TPL_ENABLE_ParMETIS=ON \
          -D TPL_ParMETIS_INCLUDE_DIRS="$PARTITIONER_PREFIX/include" \
          -D TPL_ParMETIS_LIBRARIES="$PARTITIONER_PREFIX/lib/libparmetis.so;$PARTITIONER_PREFIX/lib/libmetis.so;$PARTITIONER_PREFIX/lib/libGKlib.so" \
          -D TPL_ENABLE_BOOST=ON \
          -D TPL_ENABLE_HDF5=ON \
          -D TPL_ENABLE_Netcdf=ON \
          -D TPL_Netcdf_INCLUDE_DIRS="$NETCDF_INCLUDE_DIR" \
          -D TPL_Netcdf_LIBRARIES="$NETCDF_LIBRARY" \
          -D Trilinos_ENABLE_TESTS=OFF \
          -D Trilinos_ENABLE_EXAMPLES=OFF \
          -D Trilinos_ENABLE_Teuchos=ON \
          -D Trilinos_ENABLE_Kokkos=ON \
          -D Trilinos_ENABLE_KokkosKernels=ON \
          -D Trilinos_ENABLE_Tpetra=ON \
          -D Trilinos_ENABLE_Belos=ON \
          -D Trilinos_ENABLE_Ifpack2=ON \
          -D Trilinos_ENABLE_MueLu=ON \
          -D Trilinos_ENABLE_Zoltan=ON \
          -D Trilinos_ENABLE_Zoltan2=ON \
          -D Trilinos_ENABLE_STK=ON \
          -D Trilinos_ENABLE_SEACAS=ON \
          -D numbers_EXE_DISABLE=ON \
          -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF

        cmake --build ${{ github.workspace }}/_deps/trilinos_build --parallel 2
        cmake --install ${{ github.workspace }}/_deps/trilinos_build

    - name: Export Trilinos prefix
      shell: bash
      run: |
        PARTITIONER_PREFIX="${{ github.workspace }}/_deps/partitioners_install"
        TRILINOS_PREFIX="${{ github.workspace }}/_deps/trilinos_install"

        echo "CMAKE_PREFIX_PATH=$PARTITIONER_PREFIX:$TRILINOS_PREFIX:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PARTITIONER_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "Trilinos_DIR=$TRILINOS_PREFIX/lib/cmake/Trilinos" >> "$GITHUB_ENV"
