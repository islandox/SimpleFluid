name: Setup Trilinos from source
description: Build and cache Trilinos from source

inputs:
  trilinos-version:
    description: Trilinos git tag
    required: false
    default: trilinos-release-17-1-1

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          gfortran \
          git \
          cmake \
          ninja-build \
          pkg-config \
          openmpi-bin \
          libopenmpi-dev \
          libblas-dev \
          liblapack-dev \
          libboost-dev \
          zlib1g-dev

    - name: Cache Trilinos install
      id: cache-trilinos
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/_deps/trilinos-install
        key: trilinos-${{ inputs.trilinos-version }}-${{ runner.os }}-gcc-mpi-core-v1

    - name: Build Trilinos from source
      if: steps.cache-trilinos.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 --branch ${{ inputs.trilinos-version }} \
          https://github.com/trilinos/Trilinos.git \
          ${{ github.workspace }}/_deps/Trilinos

        cmake -S ${{ github.workspace }}/_deps/Trilinos \
          -B ${{ github.workspace }}/_deps/trilinos-build \
          -G Ninja \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/_deps/trilinos-install \
          -D CMAKE_C_COMPILER=mpicc \
          -D CMAKE_CXX_COMPILER=mpicxx \
          -D CMAKE_Fortran_COMPILER=mpifort \
          -D CMAKE_CXX_STANDARD=20 \
          -D CMAKE_CXX_EXTENSIONS=OFF \
          -D TPL_ENABLE_MPI=ON \
          -D Trilinos_ENABLE_TESTS=OFF \
          -D Trilinos_ENABLE_EXAMPLES=OFF \
          -D Trilinos_ENABLE_Teuchos=ON \
          -D Trilinos_ENABLE_Kokkos=ON \
          -D Trilinos_ENABLE_KokkosKernels=ON \
          -D Trilinos_ENABLE_Tpetra=ON \
          -D Trilinos_ENABLE_Belos=ON \
          -D Trilinos_ENABLE_Ifpack2=ON \
          -D Trilinos_ENABLE_MueLu=ON \
          -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF

        cmake --build ${{ github.workspace }}/_deps/trilinos-build --parallel 2
        cmake --install ${{ github.workspace }}/_deps/trilinos-build

    - name: Export Trilinos prefix
      shell: bash
      run: |
        echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/_deps/trilinos-install:$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
        echo "Trilinos_DIR=${{ github.workspace }}/_deps/trilinos-install/lib/cmake/Trilinos" >> "$GITHUB_ENV"