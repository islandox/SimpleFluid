# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "develop", "github_CI" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }} (${{ matrix.compiler_id }})
    runs-on: ${{ matrix.os }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      # Required to cache compilations that use the shared precompiled headers.
      CCACHE_SLOPPINESS: pch_defines,time_macros

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Exercise Release and Debug on both Linux compiler families, plus native
      # AppleClang coverage on the macOS Arm64 runner.
      matrix:
#        windows is skipped because trilinos is not fully tested on windows.
        os: [ubuntu-26.04, macos-26]
        build_type: [Release, Debug]
        compiler_id: [GCC, LLVM]
        include:
          - os: ubuntu-26.04
            compiler_id: GCC
            c_compiler: gcc
            cpp_compiler: g++
            fortran_compiler: gfortran
            cache_suffix: v5
          - os: ubuntu-26.04
            compiler_id: LLVM
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: flang
            cmake_platform_options: -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"
            cache_suffix: v5
          - os: macos-26
            compiler_id: LLVM
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: mpifort
            cmake_platform_options: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"
            cache_suffix: v8
        exclude:
          - os: macos-26
            compiler_id: GCC

    steps:
    - uses: actions/checkout@v6

    - name: Verify Arm64 runner and toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: |
        test "$(uname -m)" = "arm64"
        sw_vers
        clang --version
        clang++ --version
        cmake --version
        ninja --version

    - name: Install LLVM compilers
      if: runner.os == 'Linux' && matrix.compiler_id == 'LLVM'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          llvm \
          lld \
          flang

        clang --version
        clang++ --version
        llvm-cxxfilt --version

        if command -v flang-new >/dev/null 2>&1; then
          flang-new --version
          echo "LLVM_FC=flang-new" >> "$GITHUB_ENV"
        else
          flang --version
          echo "LLVM_FC=flang" >> "$GITHUB_ENV"
        fi

    - name: Install GCC compilers
      if: runner.os == 'Linux' && matrix.compiler_id == 'GCC'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc g++ gfortran gdb

        gcc --version
        g++ --version
        gfortran --version

    - name: Install dependencies
      uses: ./.github/actions/setup-trilinos-source
      with:
        trilinos-version: trilinos-release-17-2-1
        compiler-id: ${{ matrix.compiler_id }}
        c-compiler: ${{ matrix.c_compiler }}
        cxx-compiler: ${{ matrix.cpp_compiler }}
        fortran-compiler: ${{ matrix.fortran_compiler }}
        cache-suffix-install: ${{ matrix.cache_suffix }}
        cache-suffix-build: ${{ matrix.cache_suffix }}

    - name: Restore Open MPI signal diagnostics
      if: runner.os == 'Linux'
      run: bash .github/scripts/restore-openmpi-help.sh

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install compiler cache
      id: ccache_setup
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get install -y --no-install-recommends ccache
        else
          brew install ccache
        fi
        ccache --version

        # Separate archive generations when the compiler or macOS SDK changes.
        # ccache also checks compiler content and each compilation's inputs.
        {
          "${{ matrix.c_compiler }}" --version
          "${{ matrix.cpp_compiler }}" --version
          if [ "$RUNNER_OS" = "macOS" ]; then
            xcrun --show-sdk-version
          fi
        } > "$RUNNER_TEMP/simplefluid-compiler-identity.txt"
        compiler_hash="$(shasum -a 256 "$RUNNER_TEMP/simplefluid-compiler-identity.txt" | cut -d ' ' -f1)"
        echo "compiler-hash=$compiler_hash" >> "$GITHUB_OUTPUT"

    - name: Restore SimpleFluid compiler cache
      id: ccache
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ env.CCACHE_DIR }}
        key: simplefluid-ccache-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.compiler_id }}-${{ matrix.build_type }}-${{ steps.ccache_setup.outputs.compiler-hash }}-${{ hashFiles('.github/actions/setup-trilinos-source/action.yml') }}-${{ matrix.cache_suffix }}-${{ github.sha }}
        restore-keys: |
          simplefluid-ccache-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.compiler_id }}-${{ matrix.build_type }}-${{ steps.ccache_setup.outputs.compiler-hash }}-${{ hashFiles('.github/actions/setup-trilinos-source/action.yml') }}-${{ matrix.cache_suffix }}-

    - name: Reset compiler cache statistics
      run: ccache --zero-stats

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DSIMPLEFLUID_SPLIT_DEBUG_INFO=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
        ${{ matrix.cmake_platform_options }}
        -DTrilinos_DIR=${{ github.workspace }}/_deps/trilinos_install/lib/cmake/Trilinos
        -DSIMPLEFLUID_MAX_TEST_PROCS=2
        -DSIMPLEFLUID_RADIOLYTIC_MATERIAL_LIBRARY:FILEPATH=
        -G"Ninja Multi-Config"
        -S ${{ github.workspace }}

    - name: Check distributed mesh startup
      id: mpi_smoke
      if: runner.os == 'Linux' && matrix.compiler_id == 'GCC'
      run: |
        cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 2 --target testMeshPartitioner testGhostSyncMultiRank
        for attempt in 1 2 3; do
          timeout 30s mpiexec -n 2 ${{ steps.strings.outputs.build-output-dir }}/bin/${{ matrix.build_type }}/testMeshPartitioner --gtest_filter=MeshPartitionerTest.PartitionsRootOnlySourceGeometry --gtest_color=no
          timeout 30s mpiexec -n 2 ${{ steps.strings.outputs.build-output-dir }}/bin/${{ matrix.build_type }}/testGhostSyncMultiRank --gtest_filter=GhostSyncMultiRankTest.SyncsOwnedGlobalIdValuesToAllLocalCells --gtest_color=no
        done

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 2

    # Persist completed compilation work even if a subsequent test fails.
    - name: Save SimpleFluid compiler cache
      if: steps.ccache.outputs.cache-hit != 'true' && steps.ccache.outputs.cache-primary-key != ''
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    - name: Test
      id: test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # thermal_lib_extract is an optional local dependency, unavailable in this matrix.
      run: ctest --build-config ${{ matrix.build_type }} -j1 --output-on-failure --label-exclude '^external_material$'

    - name: Capture MPI crash diagnostics
      if: failure() && runner.os == 'Linux' && matrix.compiler_id == 'GCC' && (steps.mpi_smoke.conclusion == 'failure' || steps.test.conclusion == 'failure')
      run: bash .github/scripts/diagnose-mpi.sh '${{ steps.strings.outputs.build-output-dir }}' '${{ matrix.build_type }}'

    - name: Upload MPI crash diagnostics
      if: failure() && runner.os == 'Linux' && matrix.compiler_id == 'GCC' && (steps.mpi_smoke.conclusion == 'failure' || steps.test.conclusion == 'failure')
      uses: actions/upload-artifact@v7
      with:
        name: mpi-diagnostics-${{ matrix.compiler_id }}-${{ matrix.build_type }}
        path: ${{ steps.strings.outputs.build-output-dir }}/mpi-diagnostics

    - name: Compiler cache statistics
      if: always() && steps.ccache_setup.outcome == 'success'
      run: ccache --show-stats --verbose
