# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }} (${{ matrix.compiler_id }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Exercise Release and Debug on both Linux compiler families, plus native
      # AppleClang coverage on the macOS Arm64 runner.
      matrix:
#        windows is skipped because trilinos is not fully tested on windows.
        os: [ubuntu-26.04, macos-26]
        build_type: [Release, Debug]
        compiler_id: [GCC, LLVM]
        include:
#          - os: windows-latest
#            c_compiler: cl
#            cpp_compiler: cl
          - os: ubuntu-26.04
            compiler_id: GCC
            c_compiler: gcc
            cpp_compiler: g++
            fortran_compiler: gfortran
            cache_suffix: v5
          - os: ubuntu-26.04
            compiler_id: LLVM
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: flang
            cache_suffix: v5
          - os: ubuntu-26.04
            build_type: Debug
            compiler_id: GCC
            c_compiler: gcc
            cpp_compiler: g++
            fortran_compiler: gfortran
          - os: macos-26
            build_type: Release
            compiler_id: LLVM
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: mpifort
            cmake_platform_options: -DCMAKE_OSX_ARCHITECTURES=arm64
            cache_suffix: v7
          - os: macos-26
            build_type: Debug
            compiler_id: LLVM
            c_compiler: clang
            cpp_compiler: clang++
            fortran_compiler: mpifort
            cmake_platform_options: -DCMAKE_OSX_ARCHITECTURES=arm64
            cache_suffix: v7
        exclude:
          - os: macos-26
            compiler_id: GCC

    steps:
    - uses: actions/checkout@v6

    - name: Verify Arm64 runner and toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: |
        test "$(uname -m)" = "arm64"
        sw_vers
        clang --version
        clang++ --version
        cmake --version
        ninja --version

    - name: Install LLVM compilers
      if: runner.os == 'Linux' && matrix.compiler_id == 'LLVM'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          lld \
          flang

        clang --version
        clang++ --version

        if command -v flang-new >/dev/null 2>&1; then
          flang-new --version
          echo "LLVM_FC=flang-new" >> "$GITHUB_ENV"
        else
          flang --version
          echo "LLVM_FC=flang" >> "$GITHUB_ENV"
        fi

    - name: Install GCC compilers
      if: runner.os == 'Linux' && matrix.compiler_id == 'GCC'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc g++ gfortran

        gcc --version
        g++ --version
        gfortran --version

    - name: Install dependencies
      uses: ./.github/actions/setup-trilinos-source
      with:
        trilinos-version: trilinos-release-17-1-1
        compiler-id: ${{ matrix.compiler_id }}
        c-compiler: ${{ matrix.c_compiler }}
        cxx-compiler: ${{ matrix.cpp_compiler }}
        fortran-compiler: ${{ matrix.fortran_compiler }}
        cache-suffix-install: ${{ matrix.cache_suffix }}
        cache-suffix-build: ${{ matrix.cache_suffix }}

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        ${{ matrix.cmake_platform_options }}
        -DTrilinos_DIR=${{ github.workspace }}/_deps/trilinos_install/lib/cmake/Trilinos
        -DSIMPLEFLUID_MAX_TEST_PROCS=2
        -G"Ninja Multi-Config"
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 2

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} -j1 --output-on-failure
